[platformio]
default_envs = default
extra_configs = platformio.local.ini

[ruby]
version = 0.1.0

[env:default]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingInclude --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_upload.offset_address = 0x10000

; Tried forcing software AES/GCM here (CONFIG_MBEDTLS_HARDWARE_AES=n / CONFIG_MBEDTLS_HARDWARE_GCM=n
; via custom_sdkconfig) to remove EncryptedLog's dependency on the small DMA-capable memory pool
; that's caused real crashes during long capture sessions (see CHANGELOG). Reverted: on this pinned
; pioarduino release, setting custom_sdkconfig at all forces a full from-source rebuild of the
; entire ESP-IDF managed-component tree — including components this project never uses
; (esp-modbus, esp-zigbee, esp_insights, an HTTPS server) — and that path fails outright on a
; missing generated file (https_server.crt.S) unrelated to the mbedtls setting itself. That's a
; pioarduino/esp-idf component-packaging bug, not something fixable from here. Left as a documented
; dead end rather than attempted again blind — the heap-health circuit breaker in main.cpp is the
; real safety net for the DMA-pool exhaustion this was meant to prevent.

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -std=gnu++2a
; Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/git_branch.py
  post:scripts/check_firmware_size.py
  post:scripts/rename_firmware.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  h2zero/NimBLE-Arduino @ ^2.2.3
