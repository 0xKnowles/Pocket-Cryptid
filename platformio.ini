[platformio]
default_envs = default
extra_configs = platformio.local.ini

[ruby]
version = 0.1.0

[env:default]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingInclude --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_upload.offset_address = 0x10000

; Forces software AES/GCM to remove EncryptedLog's dependency on the small DMA-capable memory pool
; that's caused real crashes during long capture sessions (see CHANGELOG). Setting custom_sdkconfig
; at all forces this pinned pioarduino release into a full from-source rebuild of the entire ESP-IDF
; managed-component tree — including arduino-esp32's full idf_component.yml dependency graph
; (RainMaker + Insights + local-control HTTPS server, Zigbee, Modbus, esp-dsp, esp_modem...), none
; of which this project uses. The first attempt at this failed outright on a missing generated file
; (https_server.crt.S) from that unused tree. custom_component_remove (confirmed via pioarduino's
; builder/frameworks/component_manager.py — exact-matches full "owner/name" keys against
; arduino-esp32's idf_component.yml dependencies dict and deletes them before the rebuild) strips
; those components before they're ever compiled. Grep-confirmed none of mdns/LittleFS/RainMaker/
; Insights/Zigbee/Modbus/esp_modem/cJSON are referenced anywhere in this codebase.
custom_sdkconfig =
  CONFIG_MBEDTLS_HARDWARE_AES=n
  CONFIG_MBEDTLS_HARDWARE_GCM=n

custom_component_remove =
  espressif/esp_rainmaker
  espressif/rmaker_common
  espressif/esp_insights
  espressif/esp_diag_data_store
  espressif/esp_diagnostics
  espressif/network_provisioning
  espressif/esp-zigbee-lib
  espressif/esp-zboss-lib
  espressif/esp-modbus
  espressif/esp_modem
  espressif/esp-dsp

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -std=gnu++2a
; Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/git_branch.py
  post:scripts/check_firmware_size.py
  post:scripts/rename_firmware.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  h2zero/NimBLE-Arduino @ ^2.2.3
