[platformio]
default_envs = default
extra_configs = platformio.local.ini

[ruby]
version = 0.1.3

[env:default]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingInclude --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_upload.offset_address = 0x10000

; Two separate attempts to force software AES/GCM here, to remove EncryptedLog's dependency on the
; small DMA-capable memory pool that's caused real crashes during long capture sessions (see
; CHANGELOG) — both hit genuine pioarduino toolchain bugs and were reverted. custom_sdkconfig at all
; forces this pinned pioarduino release into a full from-source rebuild of the entire ESP-IDF
; managed-component tree.
;   Attempt 1: CONFIG_MBEDTLS_HARDWARE_AES=n / CONFIG_MBEDTLS_HARDWARE_GCM=n alone. Failed outright
;   on a missing generated file (https_server.crt.S) from arduino-esp32's default idf_component.yml
;   dependency graph (RainMaker + Insights + local-control HTTPS server, Zigbee, Modbus, esp-dsp,
;   esp_modem...) — none of which this project uses.
;   Attempt 2: added custom_component_remove (confirmed real via pioarduino's
;   builder/frameworks/component_manager.py — exact-matches full "owner/name" keys against the
;   resolved dependency manifest and deletes them before the rebuild) to strip those unused
;   components, which did fix the https_server.crt.S failure — CI got past it into a clean full
;   rebuild. But that exposed a second, deeper bug: pioarduino runs framework=arduino as TWO build
;   passes when custom_sdkconfig is set — a raw ESP-IDF pass (which built and linked cleanly, proving
;   software AES/GCM does compile correctly with this config) followed by a second "Arduino compile"
;   pass that recompiles the project and relinks. That second pass's linker pulled libwpa_supplicant.a
;   straight from the untouched, prebuilt framework-arduinoespressif32-libs package, and our own
;   freshly-compiled EncryptedLog.cpp.o couldn't find mbedtls_gcm_* either — undefined references to
;   mbedtls_aes_*/mbedtls_gcm_* everywhere, confirmed via the CI job log. The "Copied compiled esp32c3
;   IDF libraries to Arduino framework" step pioarduino logs before that second pass does not actually
;   wire the freshly-built libmbedcrypto.a into that pass's link command. That's a structural gap in
;   pioarduino's own two-pass build wiring for framework=arduino, not a config value — no
;   CONFIG_MBEDTLS_* flag fixes a library that never gets linked. Not fixable from this project without
;   patching pioarduino's builder scripts directly, which is out of scope. Left as a documented dead
;   end; the heap-health circuit breaker in main.cpp remains the real safety net for the DMA-pool
;   exhaustion this was meant to prevent at the source.

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -std=gnu++2a
; Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/git_branch.py
  post:scripts/check_firmware_size.py
  post:scripts/rename_firmware.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  h2zero/NimBLE-Arduino @ ^2.2.3
